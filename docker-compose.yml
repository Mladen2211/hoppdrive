services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoppdrive
      POSTGRES_USER: hoppdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports not exposed externally for security (internal Docker network only)
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoppdrive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # ports not exposed externally for security (internal Docker network only)
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API (hoppdrive-api:97) ─────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "97:97"
    environment:
      NODE_ENV: production
      PORT: 97
      DATABASE_URL: postgresql://hoppdrive:${POSTGRES_PASSWORD:-changeme}@postgres:5432/hoppdrive
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hoppdrive.ch}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@hoppdrive.ch}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-HoppDrive}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-info@hoppdrive.ch}
      UPLOAD_DIR: /app/uploads
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-5242880}
    volumes:
      - uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Frontend (Next.js B2C) (hoppdrive:99) ─────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://hoppdrive.ch/api}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://hoppdrive-admin.ch}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "99:99"
    environment:
      PORT: 99
      HOSTNAME: "0.0.0.0"
      API_INTERNAL_URL: http://api:97/api
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Admin CMS (Next.js) (hoppdrive-admin:98) ──────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://hoppdrive.ch/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "98:98"
    environment:
      PORT: 98
      HOSTNAME: "0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Cloudflare Tunnel ────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: http2
    depends_on:
      - api
      - web
      - admin
    command: ["tunnel", "run", "--token", "${TUNNEL_TOKEN}"]
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  uploads:

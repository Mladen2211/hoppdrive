# Upstream definitions
upstream nextjs {
    server web:99;
}

upstream admin_nextjs {
    server admin:98;
}

upstream api {
    server api:97;
}

# ─── HTTP → HTTPS redirect (main site) ──────────────────────
server {
    listen 80;
    server_name hoppdrive.ch www.hoppdrive.ch;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTP → HTTPS redirect (admin subdomain) ────────────────
server {
    listen 80;
    server_name hoppdrive-admin.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: Main B2C site (hoppdrive.ch) ──────────────────
server {
    listen 443 ssl http2;
    server_name hoppdrive.ch www.hoppdrive.ch;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/hoppdrive.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoppdrive.ch/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # API proxy
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # Serve uploaded images directly (with caching)
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js static assets (with cache)
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js application
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── HTTPS: Admin CMS (hoppdrive-admin.ch) ────────────────
server {
    listen 443 ssl http2;
    server_name hoppdrive-admin.ch;

    # SSL certificates (use wildcard or SAN cert covering admin subdomain)
    ssl_certificate /etc/letsencrypt/live/hoppdrive.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoppdrive.ch/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Block search engines from indexing admin
    add_header X-Robots-Tag "noindex, nofollow" always;

    # API proxy (admin talks to same API)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # Serve uploaded images (shared with main site)
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Admin Next.js static assets
    location /_next/static/ {
        proxy_pass http://admin_nextjs;
        proxy_http_version 1.1;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Admin Next.js application
    location / {
        proxy_pass http://admin_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

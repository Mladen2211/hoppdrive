<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anfragen Tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./admin.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F2F2F2}</style>
</helmet>
<div class="ad" style="position:relative;min-height:100%">
<div class="shell rail">

  <div style="background:#fff;border-right:1px solid var(--line)">
    <dc-import name="AdminNav" current="Anfragen" rail="true" hint-size="76px,100%"></dc-import>
  </div>

  <div style="min-width:0;display:flex;flex-direction:column">
    <header class="top" style="padding:0 24px;gap:12px">
      <button class="icon-btn" type="button" aria-label="Suche öffnen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg></button>
      <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
        <a class="btn btn-p" href="Calendar-Desktop.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Neue Buchung</a>
        <button class="icon-btn" type="button" aria-label="Benachrichtigungen, 4 ungelesen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot">4</span></button>
      </div>
    </header>

    <main class="main" style="padding:24px;gap:20px">
      <div class="pg-h">
        <div><h1 class="h1">Anfragen</h1><p>Eingänge aus dem Formular der Website</p></div>
        <button class="btn btn-g" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>CSV</button>
      </div>

      <nav class="pipe" aria-label="Anfragen nach Stand">
        <a href="#" aria-current="true" style="padding:14px 14px"><span class="sm mut">Neu</span><b class="num">3</b></a>
        <a href="#" style="padding:14px 14px"><span class="sm mut">Geprüft</span><b class="num">2</b></a>
        <a href="#" style="padding:14px 14px"><span class="sm mut">Beantwortet</span><b class="num">4</b></a>
        <a href="#" style="padding:14px 14px"><span class="sm mut">Gebucht</span><b class="num">11</b></a>
      </nav>

      <section class="panel" aria-labelledby="in-h">
        <div class="panel-h">
          <h2 class="h2" id="in-h">Alle Anfragen</h2>
          <div class="tabs" role="tablist" aria-label="Filter">
            <button class="tab" role="tab" aria-selected="true" type="button">Offen <small>5</small></button>
            <button class="tab" role="tab" aria-selected="false" type="button">Alle <small>20</small></button>
            <button class="tab" role="tab" aria-selected="false" type="button">Abgelehnt <small>2</small></button>
          </div>
        </div>
        <div class="scroll">
          <table class="tbl">
            <thead><tr><th>Kunde</th><th>Fahrzeug und Zeitraum</th><th>Stand</th><th class="r"><span style="position:absolute;left:-9999px">Öffnen</span></th></tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
                <tr class="{{r.sel}}">
                  <td><div class="cell-2"><b>{{r.name}}</b><span>{{r.when}}</span></div></td>
                  <td><div class="cell-2">{{r.car}}<span class="num">{{r.period}}</span></div></td>
                  <td><span class="st {{r.cls}}">{{r.status}}</span></td>
                  <td><div class="acts"><button class="ib" type="button" aria-label="Anfrage von {{r.name}} öffnen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (name, when, car, period, status, cls, sel) => ({ name, when, car, period, status, cls, sel: sel ? 'sel' : 'plain' });
    return {
      rows: [
        r('Sarah Zürcher', 'Vor 2 Tagen', 'Škoda Superb Combi', '07.12. – 20.12.', 'Neu', 's-amber', true),
        r('David Aebi', 'Vor 1 Tag', 'Hyundai Tucson', '28.11. – 30.11.', 'Neu', 's-amber'),
        r('Mira Baumann', 'Heute, 08:12', 'Škoda Enyaq iV', '02.12. – 09.12.', 'Neu', 's-amber'),
        r('Reto Gerber', 'Vor 3 Tagen', 'VW Passat Variant', '15.12. – 22.12.', 'Geprüft', 's-blue'),
        r('Anja Steiner', 'Vor 4 Tagen', 'Škoda Kodiaq', '20.12. – 03.01.', 'Geprüft', 's-blue'),
        r('Luca Moser', 'Vor 5 Tagen', 'Škoda Octavia', '01.12. – 05.12.', 'Beantwortet', 's-vio'),
        r('Julia Weber', 'Vor 6 Tagen', 'Škoda Superb Combi', '10.12. – 12.12.', 'Beantwortet', 's-vio')
      ]
    };
  }
}
</script>
</body>
</html>
